[package]
name = "hl7probe"
version = "0.3.0"
edition = "2021"
description = "Inspect and validate HL7 v2 messages from the command line"
license = "MIT"
readme = "README.md"
repository = "https://github.com/sudhi001/hl7probe"
homepage = "https://github.com/sudhi001/hl7probe"
documentation = "https://github.com/sudhi001/hl7probe#readme"
keywords = ["hl7", "healthcare", "interoperability", "cli", "validator"]
categories = ["command-line-utilities", "parser-implementations"]
rust-version = "1.88"
# examples/ ships because the integration tests read those messages.
exclude = ["docs/", ".github/"]

[[bin]]
name = "hl7probe"
path = "src/main.rs"

[dev-dependencies]
serde_json = "1"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
ratatui = "0.29"
crossterm = "0.28"
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
strip = true
# One codegen unit and no unwinding tables: ~17% off the binary at no
# measurable cost to parsing speed. Panic hooks still run, so the viewer
# restores the terminal before aborting.
codegen-units = 1
panic = "abort"

# Lint policy lives here rather than in CI flags or crate attributes, so
# `cargo clippy` locally and in CI enforce exactly the same set.
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Nursery lints worth keeping, picked individually: the group as a whole moves
# too often to hold a `-D warnings` build steady across toolchain bumps.
missing_const_for_fn = "warn"
redundant_clone = "warn"
# hl7probe parses input it does not control, so a panic is a bug, not a result.
# Test modules opt back out.
unwrap_used = "warn"

# Deliberate exceptions. Each is a style call the codebase makes on purpose.
struct_excessive_bools = "allow"  # Cli and render::Options are flag bags.
too_many_lines = "allow"          # Report rendering reads better unsplit.
many_single_char_names = "allow"  # Date arithmetic uses the textbook names.
